[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-self-healing"
version = "0.1.0"
description = "LangGraph + LSP + Docker based AI coding self-healing CLI"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-openai>=0.1.0",
  "docker>=7.0.0",
  "pyyaml>=6.0.0",
]

[project.scripts]
self-heal = "self_healing.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["self_healing*"]
