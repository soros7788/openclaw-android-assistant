project_root: ./examples/buggy_python_project
file_path: metrics.py
allowed_paths:
  - metrics.py
test_command:
  - python
  - -m
  - pytest
  - -q
max_iterations: 5
lsp:
  command:
    - pyright-langserver
    - --stdio
  language_id: python
sandbox:
  backend: auto
  image: python:3.11-slim
  timeout_seconds: 30
  workdir: /app
healer:
  provider: openai_compat
  base_url: https://free.v36.cm/v1
  model: gpt-4o-mini
  temperature: 0.0
  api_key_env: FREE_API_KEY
